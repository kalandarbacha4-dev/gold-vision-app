<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0d47a1"
  >

  <meta
    name="description"
    content="Gold Vision - سیستم مدیریت اعضا، ساختار، کتاب و کیف پول"
  >

  <title>Gold Vision</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div id="app">

    <div class="auth-page">

      <div class="auth-card">

        <div class="auth-logo">
          GV
        </div>

        <h1>
          Gold Vision
        </h1>

        <p class="auth-subtitle">
          مسیر رشد و پیشرفت
        </p>

        <p>
          در حال بررسی حساب...
        </p>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

  <script src="app.js"></script>


  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register("./sw.js")
            .then(() => {

              console.log(
                "Gold Vision PWA فعال شد."
              );

            })
            .catch(error => {

              console.error(
                "Service Worker Error:",
                error
              );

            });

        }
      );

    }

  </script>

</body>

</html>
